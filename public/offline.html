<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f6f9" />
    <title>Et lite pusterom · Luke</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8f6f9;
        color: #655078;
        font:
          15px/1.8 -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      main {
        max-width: 350px;
        text-align: center;
        padding: 35px;
      }
      h1 {
        font:
          38px/1.2 Georgia,
          serif;
      }
      p {
        color: #81718c;
        font-size: 13px;
      }
      a {
        display: inline-block;
        margin-top: 20px;
        padding: 11px 24px;
        border: 1px solid white;
        border-radius: 14px;
        background: #ffffffa0;
        color: #655078;
        text-decoration: none;
        box-shadow: 0 5px 20px #65507812;
      }
      .brand-logo {
        display: block;
        width: 128px;
        height: auto;
        margin: 0 auto 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="brand-logo" src="/brand/luke-lockup-v3.svg" width="266" height="106" alt="Luke" />
      <h1>Et lite pusterom.</h1>
      <p>
        Du er frakoblet, og denne siden er ikke lagret for bruk uten nett ennå.
        Kalenderne dine ligger fortsatt trygt i nettleseren på denne enheten.
      </p>
      <a href="/">Gå til oversikten</a>
      <p>Koble til nett for å åpne sider du ikke har besøkt før.</p>
    </main>
  </body>
</html>
